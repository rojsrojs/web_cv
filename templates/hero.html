<!doctype html>
<html lang="en" data-accent="$accent">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<meta name="description" content="$description">
<meta property="og:title" content="$title">
<meta property="og:description" content="$description">
<meta property="og:image" content="$avatar_src">
<link rel="preload" href="assets/fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/layouts/$layout.css">
<script>try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<header>
  <div class="hero no-print">
    <img src="$banner_src" alt="$banner_alt" fetchpriority="high">
    <div class="toolbar">
      <button class="btn" id="theme-toggle" type="button" aria-label="Toggle light and dark mode">
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span class="label">Theme</span>
      </button>
      <a class="btn primary" href="$pdf_file" download>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M5 21h14"/></svg>
        <span class="label">Download CV</span>
      </a>
    </div>
  </div>
  <div class="wrap identity">
    <img class="avatar" src="$avatar_src" alt="$avatar_alt">
    <div>
      <h1>$name</h1>
      <p class="role">$role</p>
      <ul class="meta">
        <li><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>$location</li>
        <li><a href="$linkedin_url" rel="noopener"><svg class="icon filled" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0z"/></svg>$linkedin_label</a></li>
      </ul>
    </div>
  </div>
</header>

<nav class="tabs no-print" aria-label="Sections">
  <div class="wrap" role="tablist">
    <a role="tab" id="tab-about" href="#about" aria-controls="about">About me</a>
    <a role="tab" id="tab-experience" href="#experience" aria-controls="experience">Experience</a>
    <a role="tab" id="tab-education" href="#education" aria-controls="education">Education</a>
    <a role="tab" id="tab-publications" href="#publications" aria-controls="publications">Publications</a>
  </div>
</nav>

<main class="wrap">
  <section id="about" role="tabpanel" aria-labelledby="tab-about" tabindex="-1">$about
  </section>
  <section id="experience" role="tabpanel" aria-labelledby="tab-experience" tabindex="-1">
    <h2 class="panel-title">Experience</h2>$experience
  </section>
  <section id="education" role="tabpanel" aria-labelledby="tab-education" tabindex="-1">
    <h2 class="panel-title">Education</h2>$education
  </section>
  <section id="publications" role="tabpanel" aria-labelledby="tab-publications" tabindex="-1">
    <h2 class="panel-title">Publications</h2>$publications
  </section>
</main>

<footer class="wrap no-print">
  <span>© $year $name</span>
  <span>$location · <a href="$linkedin_url" rel="noopener">LinkedIn</a></span>
</footer>
<script src="assets/app.js"></script>
</body>
</html>
